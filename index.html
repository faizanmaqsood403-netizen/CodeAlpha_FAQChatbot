<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ Chatbot</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#eef1f7;display:flex;justify-content:center;align-items:center;min-height:100vh}
  .chat{width:100%;max-width:520px;height:90vh;max-height:700px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.15);display:flex;flex-direction:column;overflow:hidden}
  .header{background:#4f46e5;color:#fff;padding:16px;font-size:18px;font-weight:600}
  .header small{display:block;font-weight:400;font-size:12px;opacity:.85}
  .messages{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:#f8f9fc}
  .msg{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.4;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
  .bot{background:#e5e7f5;color:#222;align-self:flex-start;border-bottom-left-radius:4px}
  .user{background:#4f46e5;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:#fff;border:1px solid #4f46e5;color:#4f46e5;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
  .chip:hover{background:#4f46e5;color:#fff}
  .input{display:flex;border-top:1px solid #ddd}
  .input input{flex:1;border:none;padding:14px;font-size:14px;outline:none}
  .input button{border:none;background:#4f46e5;color:#fff;padding:0 22px;font-size:14px;cursor:pointer}
  .input button:hover{background:#4338ca}
</style>
</head>
<body>
<div class="chat">
  <div class="header">FAQ Chatbot<small>Ask me anything about orders, payments, shipping &amp; returns</small></div>
  <div class="messages" id="messages"></div>
  <div class="input">
    <input id="text" type="text" placeholder="Type your question..." autocomplete="off" autofocus>
    <button id="send">Send</button>
  </div>
</div>
<script>
  const box = document.getElementById("messages");
  const input = document.getElementById("text");

  function addMessage(text, who, suggestions) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    if (suggestions && suggestions.length) {
      const chips = document.createElement("div");
      chips.className = "chips";
      suggestions.forEach(function (s) {
        const c = document.createElement("span");
        c.className = "chip";
        c.textContent = s;
        c.onclick = function () { send(s); };
        chips.appendChild(c);
      });
      div.appendChild(chips);
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  async function send(forced) {
    const message = (forced || input.value).trim();
    if (!message) return;
    addMessage(message, "user");
    input.value = "";
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: message})
      });
      const data = await res.json();
      addMessage(data.answer, "bot", data.suggestions);
    } catch (e) {
      addMessage("Sorry, something went wrong. Please try again.", "bot");
    }
  }

  document.getElementById("send").onclick = function () { send(); };
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
  addMessage("Hello! I'm your FAQ assistant. How can I help you today?", "bot");
</script>
</body>
</html>
